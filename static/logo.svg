<svg xmlns="http://www.w3.org/2000/svg" viewBox="13.3 15.25 80 80">
  <!-- Shampoo Arena: two drops head to head. Used as the header mark and as the favicon.
       The gap between the drops is a cut-out, not a painted outline, so the mark works on any
       background; colours follow the light or dark scheme on their own. -->
  <style>
    .front { fill: #272421; }
    .back { fill: #B8B8BA; }
    @media (prefers-color-scheme: dark) {
      .front { fill: #F2EDE6; }
      .back { fill: #5E5E62; }
    }
  </style>
  <defs>
    <path id="drop" d="M50 6C50 6 18 44 18 64a32 32 0 0 0 64 0C82 44 50 6 50 6Z"/>
    <mask id="gap">
      <rect x="0" y="0" width="100" height="110" fill="#fff"/>
      <use href="#drop" transform="translate(2 12) scale(0.7)" fill="#000" stroke="#000" stroke-width="17"/>
    </mask>
  </defs>
  <g mask="url(#gap)">
    <use class="back" href="#drop" transform="translate(26.4 17.5) scale(0.8)"/>
  </g>
  <use class="front" href="#drop" transform="translate(2 12) scale(0.7)"/>
</svg>
